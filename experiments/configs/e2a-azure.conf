# E2a: main comparison on a replay of the Azure Functions 2021 trace.
# Three one-hour windows (hours 36, 54, 284), picked at random (seed 1)
# among hours with at least the median number of arrivals, each compressed
# 100x (10 s bins -> 100 ms phases, 36 s per hour) and scaled so its
# busiest bin is 3500 req/s, floor 300 req/s. Made with:
#   workloads/traces/azure_phases.py ~/kairos-data/azure2021/AzureFunctionsInvocationTraceForTwoWeeksJan2021.txt --pick 3 --seed 1
# Baselines and kairos as in E2-final (e2f-short.conf); the ablations
# (always, batchvicp) are left out to keep the batch near an hour.
NAME=e2a-azure
SCHEDULERS="eevdf bpfland=scx:bpfland lavd=scx:lavd:--autopilot lavdperf=scx:lavd:--performance never3=kairos:--never-preempt,--batch-slice-us=3000 kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150"
REPS=5
COOLDOWN_S=10
BATCH_POLICY=batch

WORKERS=16
WORK_US=500
PHASES=$(cat workloads/traces/azure2021-pick3-seed1.phases)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
