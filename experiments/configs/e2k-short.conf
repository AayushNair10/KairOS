# E2k: does waking idle CPUs (kick_idle, commit 7f1a122) recover the batch
# throughput KairOS lost to bpfland in E2-final, and is borrower
# preemption what buys KairOS its lower latency? On the short-burst
# pattern (ml/patterns.py short 101 40).
# kairos0 = E2-final's kairos (--no-kick-idle); kairos = the same with
# idle kicks; kairosnp = idle kicks, no borrower preemption, 1 ms borrow
# slices (closest to bpfland: woken LC tasks wait for a short slice).
# Otherwise as e2f-short.conf.
NAME=e2k-short
SCHEDULERS="bpfland=scx:bpfland kairos0=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--no-kick-idle kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150 kairosnp=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--no-borrow-preempt,--borrow-slice-us=1000"
REPS=5
COOLDOWN_S=10
BATCH_POLICY=batch

WORKERS=16
WORK_US=500
PHASES=$(ml/patterns.py short 101 40)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
