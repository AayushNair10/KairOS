# E12, ablations (RESEARCH_LOG section 9, directions 3-5), E3's phases:
# sync = --wake-sync (the kernel's rule for sync wakeups; does it change
# anything for the gRPC service?); percpu = --lc-queue percpu (queued LC
# tasks wait in their CPU's own queue: is the shared LC queue why kairos
# beats Linux with SCHED_IDLE?); longest / prev = --borrower-pick (which
# borrower is preempted; kairos takes the first in CPU order). Linux with
# SCHED_IDLE batch jobs (eevdfidle) as the reference for percpu.
NAME=e12-ablate
SCHEDULERS="kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150 sync=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--wake-sync percpu=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--lc-queue=percpu longest=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--borrower-pick=longest prev=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--borrower-pick=prev eevdfidle=eevdf"
REPS=3
COOLDOWN_S=10
BATCH_POLICY=batch
BATCH_POLICY_eevdfidle=idle

WORKERS=16
WORK_US=500
PHASES=$(workloads/traces/burst_sweep.py --seed 1 2>/dev/null)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
