# E1b pilot: no batch jobs, so the only competition for CPUs 0-2 is between
# the server's own threads. Rates up to about the CPUs' capacity (3 CPUs /
# 500 us = 6000 req/s). Checks (1) whether the load generator keeps up at
# these rates, (2) what load (runnable tasks per CPU) each rate gives with
# Go's default GOMAXPROCS (3), where at most 3 workers run Go code at once.
NAME=e1b-pilot
SCHEDULERS="eevdf never=kairos:--never-preempt always=kairos:--force-preempt"
REPS=1
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="8s@1000,8s@2000,8s@3000,8s@4000,8s@5000,8s@6000"
CONNS=8

BATCH_JOBS=0
ZSTD_LEVEL=3
