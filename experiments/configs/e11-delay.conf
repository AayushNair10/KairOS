# E11, delayed borrower preemption (RESEARCH_LOG section 9, direction 2):
# does preempting a borrower only after a woken LC task has waited D keep
# most of KairOS's latency at less batch cost? E3's phases. kairos = E3's
# config (D = 0, preempts at once); pwD = --preempt-wait-us D; rN: tasks
# whose runs average >= N us (the 500 us request workers) still preempt at
# once, only short runs (Go runtime threads, ~10 us in a smoke test) wait.
# References: bpfland (never preempts, more batch) and Linux with the batch
# jobs as SCHED_IDLE (eevdfidle).
NAME=e11-delay
SCHEDULERS="kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150 pw100r100=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=100,--preempt-min-run-us=100 pw250r100=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=250,--preempt-min-run-us=100 pw1000r100=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=1000,--preempt-min-run-us=100 pw250=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=250 bpfland=scx:bpfland eevdfidle=eevdf"
REPS=5
COOLDOWN_S=10
BATCH_POLICY=batch
BATCH_POLICY_eevdfidle=idle

WORKERS=16
WORK_US=500
PHASES=$(workloads/traces/burst_sweep.py --seed 1 2>/dev/null)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
