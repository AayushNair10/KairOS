# E7a, overhead on batch throughput: three zstd jobs fill CPUs 0-2 and the
# service gets a trickle (10 req/s, 0.5% of a CPU), so batch MB/s shows
# what each scheduler costs the batch work it schedules. scx_simple is the
# minimal sched_ext scheduler (one global FIFO-like queue). Batch MB/s is
# taken over the first phase; the second only keeps the load generator
# running until the first has ended.
NAME=e7-batch
SCHEDULERS="eevdf simple=scx:simple bpfland=scx:bpfland lavd=scx:lavd:--autopilot never3=kairos:--never-preempt,--batch-slice-us=3000 kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150"
REPS=5
COOLDOWN_S=5
BATCH_POLICY=batch

WORKERS=16
WORK_US=500
PHASES=15s@10,1s@10
CONNS=8

BATCH_JOBS=3
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
