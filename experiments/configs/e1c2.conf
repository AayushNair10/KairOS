# E1c2: E1c again with the run-time classifier (batch = 20 ms of CPU since
# the task last slept; 3f3d11e) in place of the voluntary-stop EWMA, which
# relabelled busy server threads under overload (RESEARCH_LOG 6.6). Same
# workload and rates as E1c. Questions: does batchvic keep the lowest p50,
# and does it now fail at 4000-4500 req/s no more often than never3/always?
NAME=e1c2
SCHEDULERS="never3=kairos:--never-preempt,--batch-slice-us=3000 always=kairos:--force-preempt batchvic=kairos:--force-preempt,--victim=batch"
REPS=10
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="8s@1000,8s@2000,8s@3000,8s@3500,8s@4000,8s@4500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
