# Control for e2-diag / e2-split: their busy-phase tails were 2-8x E2's
# for every config, Linux's included (no BPF code). Same workload with the
# diagnostics off: if the tails are still high, the cause is outside the
# instrumentation (the host); if they match E2, the diagnostics cost it.
NAME=e2-control
SCHEDULERS="eevdf never=kairos:--never-preempt batchvic=kairos:--force-preempt,--victim=batch"
REPS=2
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="5s@500,5s@3500,5s@500,5s@3500,5s@500,5s@3500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
