# E3, burst-length sweep: does latency during a burst depend on how long
# the burst lasts? Busy phases at 3500 req/s alternate with quiet phases at
# 500 req/s of the same length L (50% duty, so the mean load is the same
# for every L), one block per L from 10 ms to 10 s, in shuffled order, each
# after 2 s at 500 req/s. Made with:
#   workloads/traces/burst_sweep.py --seed 1
# KairOS's LC pool follows demand with a ~64 ms average; borrower
# preemption reacts on each wakeup. Configs as E2a without lavdperf
# (close to lavd there), to keep the batch near 70 minutes.
NAME=e3-burst
SCHEDULERS="eevdf bpfland=scx:bpfland lavd=scx:lavd:--autopilot never3=kairos:--never-preempt,--batch-slice-us=3000 kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150"
REPS=5
COOLDOWN_S=10
BATCH_POLICY=batch

WORKERS=16
WORK_US=500
PHASES=$(workloads/traces/burst_sweep.py --seed 1 2>/dev/null)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
