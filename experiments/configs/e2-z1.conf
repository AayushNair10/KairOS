# E2, 1 zstd job: bursty load, quiet (500 req/s) and busy (3500 req/s)
# phases of 5 s, three times. Does --adaptive (1 ms target) keep batchvic's
# latency in busy phases and never's batch throughput in quiet ones?
# eevdf = Linux; never/never3 = no wakeup preemption, 20/3 ms slices;
# batchvic = always preempt, batch victims only. Latency signal from CPUs
# 0-2 only (the load generator has CPU 3). IDE idle.
NAME=e2-z1
SCHEDULERS="eevdf never=kairos:--never-preempt never3=kairos:--never-preempt,--batch-slice-us=3000 batchvic=kairos:--force-preempt,--victim=batch adaptive=kairos:--adaptive,--victim=batch,--signal-cpus=0-2"
REPS=10
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="5s@500,5s@3500,5s@500,5s@3500,5s@500,5s@3500"
CONNS=8

BATCH_JOBS=1
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
