# E2 pilot: does --adaptive switch modes on a bursty load? Alternating
# quiet (500 req/s) and busy (3500 req/s) phases of 5 s, 2 zstd jobs,
# server GOMAXPROCS 16. Latency signal from CPUs 0-2 only (the load
# generator has CPU 3). One rep; functional check, not a measurement.
NAME=e2-pilot
SCHEDULERS="never=kairos:--never-preempt batchvic=kairos:--force-preempt,--victim=batch adaptive=kairos:--adaptive,--victim=batch,--signal-cpus=0-2"
REPS=1
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="5s@500,5s@3500,5s@500,5s@3500,5s@500,5s@3500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
