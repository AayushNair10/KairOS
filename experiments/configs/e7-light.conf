# E7b, overhead at light load: the service alone at 500 req/s (a quarter
# of a CPU, no batch), so request latency shows each scheduler's own cost
# on the wakeup path rather than any queueing.
NAME=e7-light
SCHEDULERS="eevdf simple=scx:simple bpfland=scx:bpfland lavd=scx:lavd:--autopilot never3=kairos:--never-preempt,--batch-slice-us=3000 kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150"
REPS=5
COOLDOWN_S=5
BATCH_POLICY=batch

WORKERS=16
WORK_US=500
PHASES=15s@500
CONNS=8

BATCH_JOBS=0
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
