# Noise floor: run-to-run spread of the metrics under one fixed scheduler
# (EEVDF) and workload, without batch jobs. Two steady phases. Compare with
# noise-batch.conf.
NAME=noise-nobatch
SCHEDULERS="eevdf"
REPS=10
COOLDOWN_S=10

WORKERS=16
WORK_US=100
PHASES="10s@1000,10s@3000"
CONNS=8

BATCH_JOBS=0
ZSTD_LEVEL=3
