# E2, 2 zstd jobs: as e2-z1 with twice the batch work. A 1 ms target is
# never met in BATCH mode here (RESEARCH_LOG 6.8), so the adaptive runs use
# looser targets: 5 ms (mostly LATENCY in the pilot) and 10 ms (mostly
# BATCH). IDE idle.
NAME=e2-z2
SCHEDULERS="eevdf never=kairos:--never-preempt never3=kairos:--never-preempt,--batch-slice-us=3000 batchvic=kairos:--force-preempt,--victim=batch a5=kairos:--adaptive,--victim=batch,--signal-cpus=0-2,--lat-target-us=5000 a10=kairos:--adaptive,--victim=batch,--signal-cpus=0-2,--lat-target-us=10000"
REPS=10
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="5s@500,5s@3500,5s@500,5s@3500,5s@500,5s@3500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
