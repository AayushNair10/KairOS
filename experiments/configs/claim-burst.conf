# E14, part 1: --claim-borrower (one borrower preemption per CPU at a
# time) on and off, for kairos and pw1000r100, on the burst-length sweep
# of final-burst.conf (E3's phases), 10 reps, configs interleaved per rep.
# Why: in smoke run DS2 (2026-11-04, VM share 0.98) 8.8% of kairos's
# borrower preemptions picked a CPU that already had one pending while
# another borrower was free (dup_alt), against the 1% set in RESEARCH_LOG
# 5.1. kclaim, pwclaim = kairos, pw1000r100 with --claim-borrower.
# Analysis: analysis/stats.py --ref kairos --configs kairos kclaim (and
# the same for pw1000r100, pwclaim).
NAME=claim-burst
SCHEDULERS="kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150 kclaim=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--claim-borrower pw1000r100=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=1000,--preempt-min-run-us=100 pwclaim=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=1000,--preempt-min-run-us=100,--claim-borrower"
REPS=10
COOLDOWN_S=10
BATCH_POLICY=batch

WORKERS=16
WORK_US=500
PHASES=$(workloads/traces/burst_sweep.py --seed 1 2>/dev/null)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
