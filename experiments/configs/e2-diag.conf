# E2 diagnostics: what does the wakeup-only latency signal miss? E2's 2-job
# workload and configs, with scx_kairos --diag counting every wait for a CPU
# by why the task waited (woken, preempted, slice ran out) and by task
# group, and the server logging Go's goroutine scheduling latencies. Groups:
# worker threads, the server's other threads (gRPC, Go runtime), zstd, the
# load generator, softirq threads. 3 reps; the counters, not the latency
# percentiles, are the point (compare those with E2 to see the counters'
# own cost).
NAME=e2-diag
SCHEDULERS="eevdf never=kairos:--never-preempt never3=kairos:--never-preempt,--batch-slice-us=3000 batchvic=kairos:--force-preempt,--victim=batch a5=kairos:--adaptive,--victim=batch,--signal-cpus=0-2,--lat-target-us=5000 a10=kairos:--adaptive,--victim=batch,--signal-cpus=0-2,--lat-target-us=10000"
REPS=3
COOLDOWN_S=10
DIAG_COMM=grpcworker,grpcserver,zstd,loadgen,ksoftirqd

WORKERS=16
WORK_US=500
PHASES="5s@500,5s@3500,5s@500,5s@3500,5s@500,5s@3500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
