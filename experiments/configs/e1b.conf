# E1b: steady-load sweep where the server's threads compete with each other
# and nothing else. No batch jobs; GOMAXPROCS=16, so all 16 workers can be
# runnable in the kernel at once (with Go's default of 3 they wait inside
# the Go runtime instead, where the scheduler can't see them: E1b pilot,
# RESEARCH_LOG 6.3). Finer steps from 3000 req/s, where the pilot's load
# rose above 1 runnable task per CPU. Configurations as in E1.
NAME=e1b
SCHEDULERS="eevdf never=kairos:--never-preempt never3=kairos:--never-preempt,--batch-slice-us=3000 always=kairos:--force-preempt"
REPS=10
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="8s@1000,8s@2000,8s@3000,8s@3500,8s@4000,8s@4500,8s@5000"
CONNS=8

BATCH_JOBS=0
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
