# Smoke test for the experiment harness: a short quiet -> burst -> quiet
# pattern under EEVDF and scx_kairos (still scx_simple's policy, with the
# debug printk). Checks that a run produces latency and throughput logs;
# not a measurement.
NAME=smoke
SCHEDULERS="eevdf kairos"
REPS=1
COOLDOWN_S=5

# Service (grpcserver)
WORKERS=16
WORK_US=100

# Load (loadgen): comma-separated duration@requests_per_second
PHASES="5s@500,10s@3000,5s@500"
CONNS=8

# Batch: BATCH_JOBS single-threaded zstd loops (input: make_input.sh)
BATCH_JOBS=4
ZSTD_LEVEL=3
