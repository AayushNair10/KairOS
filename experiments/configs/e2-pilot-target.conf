# E2 pilot: with 2 zstd jobs a 1 ms target is never met in BATCH mode, so
# --adaptive stays in LATENCY (RESEARCH_LOG 6.8). Does a 5 or 10 ms target
# let it use BATCH mode in the quiet phases? Same pattern as e2-pilot. One
# rep; picks the target for E2's 2-job variant, not a measurement.
NAME=e2-pilot-target
SCHEDULERS="a5=kairos:--adaptive,--victim=batch,--signal-cpus=0-2,--lat-target-us=5000 a10=kairos:--adaptive,--victim=batch,--signal-cpus=0-2,--lat-target-us=10000"
REPS=1
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="5s@500,5s@3500,5s@500,5s@3500,5s@500,5s@3500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
