# E2s check: Linux with zstd as SCHED_OTHER, right after e2s (where zstd
# is SCHED_BATCH). In the S1p/S2p pilots Linux failed requests in every run
# with zstd as SCHED_BATCH, never with SCHED_OTHER (E2, EC). 5 reps.
NAME=e2s-eevdf-normal
SCHEDULERS="eevdf"
REPS=5
COOLDOWN_S=10
BATCH_POLICY=normal

WORKERS=16
WORK_US=500
PHASES="5s@500,5s@3500,5s@500,5s@3500,5s@500,5s@3500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
