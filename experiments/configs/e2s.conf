# E2s: the soft CPU split against the baselines on E2's 2-job bursty
# workload (5 s at 500 / 3500 req/s, three times), zstd as SCHED_BATCH so
# Linux and --class policy know which work is batch, server GOMAXPROCS 16
# as in E2. eevdf = Linux; never3 = no preemption, 3 ms slices;
# batchvicp = preempt batch tasks only (class by policy); split = LC and
# batch CPU pools over CPUs 0-2. 5 reps, Mac and IDE idle.
NAME=e2s
SCHEDULERS="eevdf never3=kairos:--never-preempt,--batch-slice-us=3000 batchvicp=kairos:--force-preempt,--victim=batch,--class=policy split=kairos:--split,--split-cpus=0-2,--class=policy"
REPS=5
COOLDOWN_S=10
BATCH_POLICY=batch

WORKERS=16
WORK_US=500
PHASES="5s@500,5s@3500,5s@500,5s@3500,5s@500,5s@3500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
