# E13: the dependency rule for delayed preemption (--preempt-dep-us), on
# the burst-length sweep of final-burst.conf (E3's phases), 10 reps,
# configs interleaved per rep. With kairos-pw1000r100, a short LC task
# (runs under 100 us) waits up to 1 ms before preempting a borrower; with
# the rule, one that woke another LC task within the window preempts at
# once. Windows 1, 3 and 10 ms; kairos (no delay) for reference. All with
# --claim-borrower, as in F; no --max-wait-ms, so only the rule differs.
# Smoke run (2026-11-05, 1 rep): the rule fired 3,000/s at 1 ms and
# 5,800/s at 10 ms. Decision rule: RESEARCH_LOG 5.1 (E13).
# Analysis: analysis/stats.py results/<date>-e13-dep --ref kairos-pw1000r100
NAME=e13-dep
SCHEDULERS="kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--claim-borrower kairos-pw1000r100=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--claim-borrower,--preempt-wait-us=1000,--preempt-min-run-us=100 kairos-pw1000r100-dep1000=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--claim-borrower,--preempt-wait-us=1000,--preempt-min-run-us=100,--preempt-dep-us=1000 kairos-pw1000r100-dep3000=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--claim-borrower,--preempt-wait-us=1000,--preempt-min-run-us=100,--preempt-dep-us=3000 kairos-pw1000r100-dep10000=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--claim-borrower,--preempt-wait-us=1000,--preempt-min-run-us=100,--preempt-dep-us=10000"
REPS=10
COOLDOWN_S=10
BATCH_POLICY=batch
WORKERS=16
WORK_US=500
PHASES=$(workloads/traces/burst_sweep.py --seed 1 2>/dev/null)
CONNS=8
BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
