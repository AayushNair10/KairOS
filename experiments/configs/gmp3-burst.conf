# Generality check: the server at GOMAXPROCS 3 (Go 1.26's default under a
# 3-CPU affinity mask) instead of the 16 used since E1b, on the burst-length
# sweep of final-burst.conf (E3's phases). eevdf, bpfland, and kairos and
# pw1000r100 with --claim-borrower (adopted after E14), 6 reps (the
# smallest n at which the exact Wilcoxon test can reach p < 0.05),
# configs interleaved per rep. Question: does kairos's ordering against
# the baselines hold when the Go runtime has 3 Ps instead of 16?
# Analysis: analysis/stats.py --ref kairos pw1000r100, byburst.py.
NAME=gmp3-burst
SCHEDULERS="eevdf bpfland=scx:bpfland kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--claim-borrower pw1000r100=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=1000,--preempt-min-run-us=100,--claim-borrower"
REPS=6
COOLDOWN_S=10
BATCH_POLICY=batch

WORKERS=16
WORK_US=500
PHASES=$(workloads/traces/burst_sweep.py --seed 1 2>/dev/null)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=3
