# E1b pilot, 2 batch jobs: between E1 (4 zstd) and no batch. With 2 zstd on
# CPUs 0-2, the server's threads compete with each other and with zstd.
# Checks what load each rate gives, to choose E1b's grid.
NAME=e1b-pilot-z2
SCHEDULERS="eevdf never=kairos:--never-preempt always=kairos:--force-preempt"
REPS=1
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="8s@1000,8s@2000,8s@3000,8s@4000,8s@5000"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
