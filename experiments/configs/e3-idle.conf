# E3 with Linux's own way to run batch work only when the service doesn't
# need the CPU: the batch jobs as SCHED_IDLE (eevdfidle). In Linux 7.0's
# fair class a woken normal task always preempts a SCHED_IDLE one, and a
# CPU running only SCHED_IDLE tasks counts as idle when a woken task looks
# for a CPU (kernel/sched/fair.c: check_preempt_wakeup_fair(),
# sched_idle_cpu()). That is close to KairOS's borrower preemption without
# the CPU split, and it was never measured here. kairos (SCHED_BATCH batch
# jobs, as in E3) runs in the same batch for a same-batch comparison; the
# phases are E3's.
NAME=e3-idle
SCHEDULERS="eevdfidle=eevdf kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150"
REPS=3
COOLDOWN_S=10
BATCH_POLICY=batch
BATCH_POLICY_eevdfidle=idle

WORKERS=16
WORK_US=500
PHASES=$(workloads/traces/burst_sweep.py --seed 1 2>/dev/null)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
