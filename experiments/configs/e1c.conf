# E1c: batch and request threads mixed. 2 zstd jobs and the server on
# CPUs 0-2, server GOMAXPROCS=16 so its workers are visible to the kernel.
# Plain always-preempt can hit zstd or a worker in the middle of a request;
# batchvic preempts only tasks classified batch (--victim batch). Question:
# does batchvic match always where preempting zstd helped (E1) and never3
# where preempting workers hurt (E1b), at every rate?
NAME=e1c
SCHEDULERS="eevdf never=kairos:--never-preempt never3=kairos:--never-preempt,--batch-slice-us=3000 always=kairos:--force-preempt batchvic=kairos:--force-preempt,--victim=batch"
REPS=10
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="8s@1000,8s@2000,8s@3000,8s@3500,8s@4000,8s@4500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
