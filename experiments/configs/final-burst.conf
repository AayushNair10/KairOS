# Final evaluation, part 1: the burst-length sweep (E3's phases; busy 3500
# req/s and quiet 500 req/s phases of equal length L = 10 ms - 10 s, 50%
# duty, shuffled blocks, made with workloads/traces/burst_sweep.py --seed 1)
# with every baseline and both kairos variants in one batch, 10 reps,
# configs interleaved per rep (run.sh reverses the order every other rep).
# kairos = E3's config (borrowers preempted at once); pw1000r100 = E11's
# delayed preemption (an LC task whose runs average under 100 us waits up
# to 1 ms before the timer preempts a borrower), the candidate main
# configuration, chosen from this same data. eevdfidle = Linux with the
# batch jobs as SCHED_IDLE. Analysis: analysis/stats.py (Wilcoxon
# signed-rank paired by rep, Holm, bootstrap CIs), byburst.py.
NAME=final-burst
SCHEDULERS="eevdf eevdfidle=eevdf bpfland=scx:bpfland lavd=scx:lavd:--autopilot lavdperf=scx:lavd:--performance never3=kairos:--never-preempt,--batch-slice-us=3000 kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150 pw1000r100=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=1000,--preempt-min-run-us=100"
REPS=10
COOLDOWN_S=10
BATCH_POLICY=batch
BATCH_POLICY_eevdfidle=idle

WORKERS=16
WORK_US=500
PHASES=$(workloads/traces/burst_sweep.py --seed 1 2>/dev/null)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
