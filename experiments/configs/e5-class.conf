# E5: task classification without labels. kairos-pw1000r100 as in F
# (--class=policy: batch = SCHED_BATCH/SCHED_IDLE, which run.sh gives zstd)
# against the same with --class=run (batch = ran 20 ms of CPU since it last
# slept; the policy is ignored), on the burst-length sweep (E3's phases),
# 10 reps, configs interleaved per rep.
# Decision rule: RESEARCH_LOG 5.1 (E5).
# Analysis: analysis/stats.py results/<date>-e5-class --ref kairos-pw1000r100
NAME=e5-class
SCHEDULERS="kairos-pw1000r100=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--claim-borrower,--preempt-wait-us=1000,--preempt-min-run-us=100 kairos-pw1000r100-classrun=kairos:--split,--split-cpus=0-2,--class=run,--lc-buffer-pct=150,--claim-borrower,--preempt-wait-us=1000,--preempt-min-run-us=100"
REPS=10
COOLDOWN_S=10
BATCH_POLICY=batch
WORKERS=16
WORK_US=500
PHASES=$(workloads/traces/burst_sweep.py --seed 1 2>/dev/null)
CONNS=8
BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
