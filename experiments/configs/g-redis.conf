# G, generality: Redis instead of the gRPC server. Three single-threaded
# redis-server instances with 10,000 keys of 1 KB each; every request is a
# GET of a random key. A GET takes ~10-20 us of CPU, so the service needs
# little CPU but wakes up often; three zstd jobs fill CPUs 0-2, so a woken
# Redis finds no idle CPU. Phases: 5 s quiet (2,000 GET/s) and 5 s busy
# (20,000/s: at 40,000/s the load generator fell behind on its CPU in a
# test), 6 times. kairos as in E3; pwD = delayed preemption, D us (every
# Redis run is short, so all wakeups wait up to D).
NAME=g-redis
SERVICE=redis
SCHEDULERS="eevdf eevdfidle=eevdf bpfland=scx:bpfland kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150 pw50=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=50 pw200=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=200"
REPS=5
COOLDOWN_S=10
BATCH_POLICY=batch
BATCH_POLICY_eevdfidle=idle

REDIS_INSTANCES=3
REDIS_KEYS=10000
REDIS_VALUE_BYTES=1024
PHASES="5s@2000,5s@20000,5s@2000,5s@20000,5s@2000,5s@20000,5s@2000,5s@20000,5s@2000,5s@20000,5s@2000,5s@20000"
CONNS=4

BATCH_JOBS=3
ZSTD_LEVEL=3
