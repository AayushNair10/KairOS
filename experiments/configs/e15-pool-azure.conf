# E15, part 2: does sizing the LC pool to the load pay? kairos-pw1000r100
# as in F (1.5 CPUs of headroom: the pool stays at 3 CPUs, section 6.32)
# against the same with 0.5 CPU (--lc-buffer-pct=50: the pool can shrink to
# 2 CPUs when LC demand is under ~1.25 CPUs, giving batch a CPU of its own),
# on the Azure Functions 2021 replay (E2a's), 10 reps, configs interleaved per rep.
# Decision rule: RESEARCH_LOG 5.1 (E15).
# Analysis: analysis/stats.py results/<date>-e15-pool-azure --ref kairos-pw1000r100
NAME=e15-pool-azure
SCHEDULERS="kairos-pw1000r100=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--claim-borrower,--preempt-wait-us=1000,--preempt-min-run-us=100 kairos-pw1000r100-buf50=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=50,--claim-borrower,--preempt-wait-us=1000,--preempt-min-run-us=100"
REPS=10
COOLDOWN_S=10
BATCH_POLICY=batch
WORKERS=16
WORK_US=500
PHASES=$(cat workloads/traces/azure2021-pick3-seed1.phases)
CONNS=8
BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
