# Soft CPU split pilot 2: as e2s-pilot with diagnostics on and a variant
# that never preempts borrowers (splitnp: batch tasks on LC CPUs get 1 ms
# slices instead). Server GOMAXPROCS 3. Pilot 1 collapsed in a busy
# phase under both policy-class configs while the server used more CPU;
# the guess is Go threads spinning with GOMAXPROCS 16 on 3 CPUs.
NAME=e2s-pilot-gmp3
SCHEDULERS="eevdf never3=kairos:--never-preempt,--batch-slice-us=3000 batchvicp=kairos:--force-preempt,--victim=batch,--class=policy split=kairos:--split,--split-cpus=0-2,--class=policy splitnp=kairos:--split,--split-cpus=0-2,--class=policy,--no-borrow-preempt,--borrow-slice-us=1000"
REPS=1
DIAG_COMM=grpcworker,grpcserver,zstd,loadgen,ksoftirqd
COOLDOWN_S=10
BATCH_POLICY=batch

WORKERS=16
WORK_US=500
PHASES="5s@500,5s@3500,5s@500,5s@3500,5s@500,5s@3500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=3
