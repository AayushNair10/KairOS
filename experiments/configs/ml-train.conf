# Training data for the LC demand predictor (ml/train_burst.py): the
# reactive soft CPU split with --ml-trace on a random burst pattern
# (ml/patterns.py random: phases 0.25-3 s, quiet 300-700 req/s, busy
# 2500-3500 req/s). The pattern seed comes from ML_SEED (default 1) and is
# part of NAME; the expanded PHASES string is recorded in meta.json.
# Test patterns (short, periodic) are never used for training.
ML_SEED=${ML_SEED:-1}
NAME=ml-train-s$ML_SEED
SCHEDULERS="split=kairos:--split,--split-cpus=0-2,--class=policy"
REPS=1
COOLDOWN_S=10
BATCH_POLICY=batch
ML_TRACE=1

WORKERS=16
WORK_US=500
PHASES=$(ml/patterns.py random "$ML_SEED" 60)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
