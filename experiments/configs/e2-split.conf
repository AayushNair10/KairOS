# E2 split: e2-diag again (same workload, configs and --diag counters)
# with the server also reporting when its handler received each request
# and how long the handler took to run again after the worker finished
# (recv_unix_ns, wake_ns in requests.csv). Splits the latency that is
# neither queueing for a worker nor the work into: the way in, the
# handler wake-up and the way back. 2 reps.
NAME=e2-split
SCHEDULERS="eevdf never=kairos:--never-preempt never3=kairos:--never-preempt,--batch-slice-us=3000 batchvic=kairos:--force-preempt,--victim=batch a5=kairos:--adaptive,--victim=batch,--signal-cpus=0-2,--lat-target-us=5000 a10=kairos:--adaptive,--victim=batch,--signal-cpus=0-2,--lat-target-us=10000"
REPS=2
COOLDOWN_S=10
DIAG_COMM=grpcworker,grpcserver,zstd,loadgen,ksoftirqd

WORKERS=16
WORK_US=500
PHASES="5s@500,5s@3500,5s@500,5s@3500,5s@500,5s@3500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
