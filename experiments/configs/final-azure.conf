# Final evaluation, part 2: the Azure Functions 2021 replay of E2a (hours
# 36, 54, 284, 100x compressed, per-hour peak 3500 req/s, floor 300; made
# with workloads/traces/azure_phases.py ... --pick 3 --seed 1) with the
# configs of final-burst.conf, 10 reps, configs interleaved per rep.
# Analysis: analysis/stats.py --by level (Wilcoxon signed-rank paired by
# rep, Holm, bootstrap CIs), bylevel.py --windows 3.
NAME=final-azure
SCHEDULERS="eevdf eevdfidle=eevdf bpfland=scx:bpfland lavd=scx:lavd:--autopilot lavdperf=scx:lavd:--performance never3=kairos:--never-preempt,--batch-slice-us=3000 kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150 pw1000r100=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=1000,--preempt-min-run-us=100"
REPS=10
COOLDOWN_S=10
BATCH_POLICY=batch
BATCH_POLICY_eevdfidle=idle

WORKERS=16
WORK_US=500
PHASES=$(cat workloads/traces/azure2021-pick3-seed1.phases)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
