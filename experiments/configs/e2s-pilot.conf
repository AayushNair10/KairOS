# Soft CPU split pilot (--split, RESEARCH_LOG 2.10): E2's 2-job bursty
# workload with zstd as SCHED_BATCH, so Linux and --class policy know which
# work is batch. eevdf = Linux (zstd SCHED_BATCH); never3 = no preemption,
# 3 ms slices; batchvicp = preempt batch tasks only, class by policy;
# split = the LC/batch CPU pools over CPUs 0-2. One rep: does the pool
# follow the load, and what happens to latency and batch throughput?
NAME=e2s-pilot
SCHEDULERS="eevdf never3=kairos:--never-preempt,--batch-slice-us=3000 batchvicp=kairos:--force-preempt,--victim=batch,--class=policy split=kairos:--split,--split-cpus=0-2,--class=policy"
REPS=1
COOLDOWN_S=10
BATCH_POLICY=batch

WORKERS=16
WORK_US=500
PHASES="5s@500,5s@3500,5s@500,5s@3500,5s@500,5s@3500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
