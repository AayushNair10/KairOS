# E7d, cost of each scheduler's BPF callbacks under E2's load (5 s quiet /
# 5 s busy, 2 zstd). Needs kernel.bpf_stats_enabled=1 (experiments/e7.sh
# sets it and resets it); BPF_STATS=1 saves `bpftool prog show` before
# each unload. The counting itself adds a little time to every callback,
# so these runs are not used for latency or throughput.
NAME=e7-bpfstats
SCHEDULERS="simple=scx:simple bpfland=scx:bpfland lavd=scx:lavd:--autopilot never3=kairos:--never-preempt,--batch-slice-us=3000 kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150"
REPS=2
COOLDOWN_S=5
BATCH_POLICY=batch
BPF_STATS=1

WORKERS=16
WORK_US=500
PHASES=5s@500,5s@3500,5s@500,5s@3500
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
