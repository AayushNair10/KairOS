# Diagnostic: which tasks change batch class under overload with batch-only
# victims (E1c's two collapsed batchvic runs). As E1c, but rates driven past
# capacity, and the scheduler prints every class change (read trace_pipe).
NAME=diag-class
SCHEDULERS="batchvic=kairos:--force-preempt,--victim=batch,--trace-class"
REPS=2
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="8s@3000,8s@4500,8s@5500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
