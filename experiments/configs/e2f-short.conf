# E2-final, main comparison on short bursts (ml/patterns.py short, seed 101).
# Baselines: eevdf = Linux; bpfland, lavd (autopilot) and lavdperf
# (performance mode) = scx 1.1.4; never3 / always = scx_kairos static
# modes (no wakeup preemption with 3 ms slices / preempt any task);
# batchvicp = preempt batch tasks only. kairos = the design as it stands
# (RESEARCH_LOG 6.12, 6.13): soft CPU split over CPUs 0-2 with the LC pool
# at its largest (buffer 1.5 CPUs), batch = SCHED_BATCH.
# zstd SCHED_BATCH for every config, server GOMAXPROCS 16, 5 reps.
NAME=e2f-short
SCHEDULERS="eevdf bpfland=scx:bpfland lavd=scx:lavd:--autopilot lavdperf=scx:lavd:--performance never3=kairos:--never-preempt,--batch-slice-us=3000 always=kairos:--force-preempt batchvicp=kairos:--force-preempt,--victim=batch,--class=policy kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150"
REPS=5
COOLDOWN_S=10
BATCH_POLICY=batch

WORKERS=16
WORK_US=500
PHASES=$(ml/patterns.py short 101 40)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
