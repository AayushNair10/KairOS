# E1 pilot: one rep per configuration over a rising request rate, to see
# what load (runnable tasks per CPU) each rate gives and roughly where the
# modes differ, before choosing the E1 grid.
NAME=e1-pilot
SCHEDULERS="eevdf never=kairos:--never-preempt always=kairos:--force-preempt"
REPS=1
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="8s@500,8s@1000,8s@2000,8s@3000,8s@4000"
CONNS=8

BATCH_JOBS=4
ZSTD_LEVEL=3
