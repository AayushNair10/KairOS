# G-nb: G without the batch jobs. Under G, kairos's Redis p50 was ~5x lower
# than Linux's (0.1 vs 0.5 ms) and the load generator's send lag p99 was
# 1-8 ms. With no zstd on CPUs 0-2, a gap that remains does not come from
# how the schedulers share those CPUs with batch (guess: from how CPU 3, the
# load generator's CPU, is scheduled). Otherwise as g-redis.conf.
NAME=g-redis-nobatch
SERVICE=redis
SCHEDULERS="eevdf bpfland=scx:bpfland kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150"
REPS=3
COOLDOWN_S=10

REDIS_INSTANCES=3
REDIS_KEYS=10000
REDIS_VALUE_BYTES=1024
PHASES="5s@2000,5s@20000,5s@2000,5s@20000,5s@2000,5s@20000,5s@2000,5s@20000,5s@2000,5s@20000,5s@2000,5s@20000"
CONNS=4

BATCH_JOBS=0
