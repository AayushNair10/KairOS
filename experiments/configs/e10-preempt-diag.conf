# E10, which wakeups preempt (RESEARCH_LOG section 9, direction 1): E3's
# phases with --diag, which records per task group how long each run that
# began by preempting a borrower lasted (diag.csv kind "preempt"), and the
# waits. The server names its request workers "grpcworker"; its other
# threads (Go runtime, gRPC transport) keep "grpcserver". kairos as in E3,
# and kpw: delayed preemption (wait up to 250 us; tasks whose runs average
# >= 100 us preempt at once), to see which preemptions remain. --diag adds
# work to every callback, so latency and throughput here are not compared
# with runs without it.
NAME=e10-diag
SCHEDULERS="kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150 kpw=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=250,--preempt-min-run-us=100"
REPS=3
COOLDOWN_S=10
BATCH_POLICY=batch
DIAG_COMM=grpcworker,grpcserver,zstd

WORKERS=16
WORK_US=500
PHASES=$(workloads/traces/burst_sweep.py --seed 1 2>/dev/null)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
