# E14, part 2: claim-burst.conf's four configs on the Azure Functions 2021
# replay of final-azure.conf (E2a's phases), 10 reps, configs interleaved
# per rep. Analysis: analysis/stats.py --by level --ref kairos --configs
# kairos kclaim (and the same for pw1000r100, pwclaim).
NAME=claim-azure
SCHEDULERS="kairos=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150 kclaim=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--claim-borrower pw1000r100=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=1000,--preempt-min-run-us=100 pwclaim=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150,--preempt-wait-us=1000,--preempt-min-run-us=100,--claim-borrower"
REPS=10
COOLDOWN_S=10
BATCH_POLICY=batch

WORKERS=16
WORK_US=500
PHASES=$(cat workloads/traces/azure2021-pick3-seed1.phases)
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
