# E1b pilot, GOMAXPROCS=16: as e1b-pilot.conf (no batch jobs, rates up to
# the CPUs' capacity), but with GOMAXPROCS=16 so all 16 workers can run Go
# code, and so be runnable in the kernel, at once.
NAME=e1b-pilot-gmp16
SCHEDULERS="eevdf never=kairos:--never-preempt always=kairos:--force-preempt"
REPS=1
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="8s@1000,8s@2000,8s@3000,8s@4000,8s@5000,8s@6000"
CONNS=8

BATCH_JOBS=0
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
