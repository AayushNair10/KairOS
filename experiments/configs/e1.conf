# E1: steady-load sweep. Rising request rate (8 s per step) with 4 zstd jobs
# on the 3 workload CPUs, so tasks per CPU stay above 1 and the wakeup
# preemption decision matters. never3 = never-preempt with the LATENCY
# mode's 3 ms slice, to separate the effect of preemption from slice length.
NAME=e1
SCHEDULERS="eevdf never=kairos:--never-preempt never3=kairos:--never-preempt,--batch-slice-us=3000 always=kairos:--force-preempt"
REPS=10
COOLDOWN_S=10

WORKERS=16
WORK_US=500
PHASES="8s@500,8s@1000,8s@2000,8s@3000,8s@4000"
CONNS=8

BATCH_JOBS=4
ZSTD_LEVEL=3
