# ML test on E2's periodic pattern (5 s at 500 / 3500 req/s), a pattern kind the model
# (ml/models/burst-v1.txt, trained on ml-train seeds 1-3, random pattern)
# never saw. split = reactive pool sizing (buffer 0.5 CPU); splitml = the
# same + the model's predictions; splitbuf = reactive with a 1.5 CPU
# buffer, about the extra LC capacity the model asks for offline
# (ml/train_burst.py's matched-buffer baseline); batchvicp for reference.
# zstd SCHED_BATCH, GOMAXPROCS 16, 5 reps; the split runs write ml_trace.csv
# (offline test data).
NAME=ml-test-periodic
SCHEDULERS="split=kairos:--split,--split-cpus=0-2,--class=policy splitml=kairos:--split,--split-cpus=0-2,--class=policy,--ml-model=ml/models/burst-v1.txt splitbuf=kairos:--split,--split-cpus=0-2,--class=policy,--lc-buffer-pct=150 batchvicp=kairos:--force-preempt,--victim=batch,--class=policy"
REPS=5
COOLDOWN_S=10
BATCH_POLICY=batch
ML_TRACE=1

WORKERS=16
WORK_US=500
PHASES="5s@500,5s@3500,5s@500,5s@3500,5s@500,5s@3500"
CONNS=8

BATCH_JOBS=2
ZSTD_LEVEL=3
SERVER_GOMAXPROCS=16
